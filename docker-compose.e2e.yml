# Adds the Playwright test runner to the stack. Use scripts/test-e2e.sh rather than calling this
# directly: it picks a separate project name, matches the image to the package version and cleans up.
services:
  db:
    ports: !reset []

  app:
    ports: !reset []
    networks:
      default:
        # Chromium forces HTTPS for any host named "app" (.app is an HSTS-preloaded TLD),
        # so the browser reaches the app under this alias instead.
        aliases: [signage-web]
    environment:
      SIGNAGE__SEEDDEMO: "false" # E2E tests create their own content
      # Every E2E device comes from the one test container IP: allow more screen address exchanges than the default 10/min.
      SIGNAGE__SCREENADDRESSEXCHANGESPERMINUTE: "120"
      # Test-only values for the throwaway E2E database; never use them anywhere else.
      SIGNAGE__BOOTSTRAP__ADMINEMAIL: e2e-admin@example.org
      SIGNAGE__BOOTSTRAP__ADMINPASSWORD: e2e-bootstrap-password

  # Test media (generated by scripts/generate-test-media.sh) and the WP-07 spike harness. The host name has no
  # dot-TLD so Chromium's HSTS preload can't force HTTPS on it (see the app alias above).
  testmedia:
    image: nginx:1.30.6-alpine
    volumes:
      - ./artifacts/media:/usr/share/nginx/html/media:ro
      - ./tests/Signage.E2E/spikes:/usr/share/nginx/html/spikes:ro
    profiles: ["e2e"]

  e2e:
    build:
      context: .
      dockerfile: tests/Signage.E2E/Dockerfile
      args:
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:?set by scripts/test-e2e.sh}
    image: signage-e2e:local
    user: "${E2E_UID:-1000}:${E2E_GID:-1000}"
    ipc: host            # recommended by Playwright for Chromium
    environment:
      SIGNAGE_E2E_BASEURL: http://signage-web:8080
      SIGNAGE_E2E_ARTIFACTS: /artifacts
      SIGNAGE_E2E_ADMIN_EMAIL: e2e-admin@example.org
      SIGNAGE_E2E_ADMIN_BOOTSTRAP_PASSWORD: e2e-bootstrap-password
      SIGNAGE_E2E_MEDIA_BASEURL: http://testmedia
      SIGNAGE_E2E_SPIKE: ${SIGNAGE_E2E_SPIKE:-}
      SIGNAGE_E2E_SPIKE_LONG: ${SIGNAGE_E2E_SPIKE_LONG:-}
    volumes:
      - ./artifacts/e2e:/artifacts
    depends_on:
      app:
        condition: service_started
      testmedia:
        condition: service_started
    profiles: ["e2e"]
